name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'davemachado/grimmory'
    steps:
      - name: Fast-forward develop from grimmory-tools/grimmory
        env:
          # The default GITHUB_TOKEN can never write .github/workflows/* files,
          # regardless of the permissions block above. Upstream regularly touches
          # workflow files (e.g. dependabot version bumps), which makes syncs fail
          # with "Upstream commits contain workflow changes...". A PAT with the
          # `repo` and `workflow` scopes is required instead.
          GH_TOKEN: ${{ secrets.SYNC_FORK_PAT }}
        run: gh repo sync davemachado/grimmory -b develop
